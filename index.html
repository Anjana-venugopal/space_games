<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASTRO-QUEST: ODYSSEY</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--p:rgba(8,16,36,.94);--t:#e8f1ff;--m:#8fb0d8;--a:#38bdf8;--ok:#34d399;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--p:rgba(236,244,255,.97);--t:#0b1530;--m:#37557f}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font:14px Inter,system-ui,sans-serif;color:var(--t);overflow:hidden}
h2,h3{font-family:Orbitron,system-ui,sans-serif;margin:.2em 0}
#w{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:100%;aspect-ratio:16/9;max-height:100%;object-fit:contain}
.panel{background:var(--p);border:1px solid #38bdf866;border-radius:14px;padding:12px;color:var(--t)}
button{font:inherit;color:#e8f1ff;background:#12305a;border:1px solid var(--a);border-radius:8px;padding:7px 11px;cursor:pointer;margin:2px}
button:disabled{opacity:.4;cursor:default}button.go{background:linear-gradient(90deg,#f59e0b,#f97316);color:#111;font-weight:700;border:0}
button.on{outline:3px solid #fde047}.sw{width:30px;height:30px;padding:0;border-radius:50%}
.o{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
.hide{display:none!important}small,.m{color:var(--m)}.ok{color:var(--ok)}.bad{color:var(--bad)}
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}#hud>*{pointer-events:auto}
#mod{background:#000a;z-index:5}#lobby{justify-content:flex-end;align-items:flex-start}
#alert{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;border:2px solid #fff;border-radius:12px;padding:8px 14px;font-weight:700;text-align:center;animation:fl .7s infinite alternate;z-index:3}
@keyframes fl{to{background:#f59e0b;color:#111}}@media(prefers-reduced-motion:reduce){#alert{animation:none}}
#pad{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}#pad>div{pointer-events:auto}
#pad button{width:46px;height:46px;font-size:18px}
#fb{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(760px,96%);z-index:2}
.bt{display:block;width:100%;text-align:left;margin:5px 0}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#log{height:130px;overflow:auto;margin:6px 0}#log p{margin:4px 0}
input[type=text]{background:#0006;border:1px solid var(--a);color:inherit;border-radius:8px;padding:7px;font:inherit}
</style></head><body><div id="w">
<canvas id="c"></canvas>
<div id="hud" class="hide">
<div class="panel" style="padding:6px 10px">HULL <b id="hh">100%</b> <span id="sh"></span></div>
<div class="panel" id="obj" style="flex:1;min-width:210px;padding:6px 10px"></div>
<button id="vb" onclick="vw()">OUTSIDE VIEW [V]</button><button id="ob" onclick="ovr()">ARIA OVERRIDE (1)</button><button onclick="lobby()">LOBBY</button></div>
<div id="alert" class="hide"></div>
<div id="pad" class="hide"><div><button onpointerdown="K.pl=1" onpointerup="K.pl=0" onpointerleave="K.pl=0">◀</button><button onpointerdown="K.pu=1" onpointerup="K.pu=0" onpointerleave="K.pu=0">▲</button><button onpointerdown="K.pd=1" onpointerup="K.pd=0" onpointerleave="K.pd=0">▼</button><button onpointerdown="K.pr=1" onpointerup="K.pr=0" onpointerleave="K.pr=0">▶</button></div><div><button class="go" onclick="act()" style="width:auto">CONSOLE [E]</button></div></div>
<div id="fb" class="panel hide"></div>
<div id="lobby" class="o"></div>
<div id="mod" class="o hide"><div class="panel" id="mc" style="max-width:640px;width:100%"></div></div>
</div>
<script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),W=960,H=540;c.width=W;c.height=H;
const COL=[['#f97316','#fdba74'],['#e2e8f0','#38bdf8'],['#06b6d4','#a5f3fc'],['#ef4444','#fca5a5'],['#10b981','#6ee7b7'],['#a855f7','#d8b4fe']],PAT=['🌕','🪐','🛰️','☄️'],RIB=['#f59e0b','#38bdf8','#ef4444','#34d399'];
let S={name:'ARYA',col:0,pat:0,rib:0,ea:[0,0,0]};try{Object.assign(S,JSON.parse(localStorage.getItem('aq')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('aq',JSON.stringify(S))}catch(e){}};
let ac;function b(f,d=.12,t='square'){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const K={},G={mode:'lobby',mi:0,si:0,hits:0,px:480,py:270,f:1,wf:0,sx:480,sy:470,met:[],ms:{},ov:1,rv:300,flag:0,dance:0,orb:0,oa:0,st:[]};
for(let i=0;i<120;i++)G.st.push([Math.random()*W,Math.random()*H,Math.random()*1.8+.3,Math.random()*1.4+.4]);
/* Rooms: x,y,w,h,name,floor */
const R={elec:[40,50,200,165,'ELECTRICAL (KITO BUS)','#1b1947'],life:[260,50,200,165,'LIFE SUPPORT (ECLSS)','#0c273c'],nav:[480,50,200,165,'NAVIGATION BRIDGE','#0b1e36'],sci:[700,50,220,165,'SCIENCE OBSERVATORY','#162a45'],gyro:[40,325,200,165,'GNC / REACTION WHEELS','#1f1638'],eng:[260,325,200,165,'CRYO & ENGINE BAY','#2c1810'],bay:[480,325,200,165,'OPTICS / ARCHIVE BAY','#2b1d12'],lab:[700,325,220,165,'ASTROBIOLOGY LAB','#1d2236']};
const C={};for(const k in R){const r=R[k];C[k]=[r[0]+r[2]/2,r[1]<200?r[1]+105:r[1]+60]}
function walk(px,py){if(px>50&&px<910&&py>240&&py<300)return 1;for(const k in R){const r=R[k],cx=r[0]+r[2]/2,top=r[1]<200;if(px>r[0]+12&&px<r[0]+r[2]-12&&py>r[1]+12&&py<r[1]+r[3]-12)return 1;if(Math.abs(px-cx)<28&&(top?py>200&&py<242:py>298&&py<340))return 1}return 0}
/* Missions: g=0 real, 1 simplified model, 2 fictional scenario with real facts */
const M=[{n:'Journey to the Moon',d:'Eclipse power, CO₂ scrubbing, meteoroids, reaction wheels, landing-site choice.',steps:[
{r:'elec',t:'Eclipse power crunch',q:'In Earth’s shadow the solar arrays give 0 W and the battery can supply 500 W. Critical systems need 450 W. How much extra load can stay on?',o:['About 50 W at most','400 W','Everything, batteries are unlimited'],a:0,w:'500 − 450 = 50 W of margin. Shed the big optional loads.',act:{k:'load',lim:500,b:[['Life support',150,1],['Cargo floodlights',220,0],['Flight computer',150,1],['Cabin heater',150,1],['Galley oven',210,0]]}},
{r:'life',t:'CO₂ is rising',g:1,q:'Which chemical absorbs CO₂ from cabin air? (It does not make oxygen. O₂ comes from tanks or electrolysis.)',o:['Lithium hydroxide (LiOH)','Liquid helium','Hydrazine'],a:0,w:'LiOH + CO₂ makes lithium carbonate, which saturates over time, so cartridges get swapped.',act:{k:'seq',s:['Close canister isolation valve','Eject saturated cartridge','Insert fresh LiOH cartridge','Reopen airflow and check CO₂']}},
{r:'nav',t:'Meteoroid alert',k:'met'},
{r:'gyro',t:'Reaction wheel saturated',g:1,q:'A reaction wheel is spinning near its limit. Why not simply stop it?',o:['Braking it alone passes the spin to the whole spacecraft','It would melt the hull','Wheels can’t be stopped'],a:0,w:'Angular momentum is conserved. Thrusters give the outside torque that lets the wheel slow safely.',act:{k:'seq',s:['Hold attitude with RCS thrusters','Fire RCS thrusters against the spin','Slow wheel to near-zero RPM','Release thrusters, confirm stable']}},
{r:'nav',t:'Choose a landing zone',q:'Landers tip over on steep ground. Which zone is safest?',o:['Crater floor: 18° slope','Connecting ridge: 4° slope, few boulders','Boulder field: 2° slope, 40 boulders'],a:1,w:'Low slope AND few boulders. A flat field full of rocks can still wreck a lander.'}]},
{n:'Discover an Exoplanet',d:'Telescope cooling, meteoroids, mirror phasing and a TESS transit light curve (TOI-700 d).',steps:[
{r:'eng',t:'Cool the infrared eyes',q:'JWST’s sunshield cools it to about 40 K, yet MIRI has its own cryocooler (~7 K). Why?',o:['Mid-infrared detectors must be colder than the telescope’s own heat glow','To spin the reaction wheels','To power radio links'],a:0,w:'Warm objects glow in infrared, so the detector must be colder than everything it looks through.',act:{k:'tap',s:['Tension layer 1','Tension layer 2','Tension layer 3','Tension layer 4','Tension layer 5','Start cryocooler']}},
{r:'nav',t:'Micrometeoroid alert',k:'met'},
{r:'bay',t:'Phase the gold mirrors',q:'Why are JWST’s hexagonal beryllium mirrors coated in gold?',o:['Gold reflects infrared light very efficiently','Gold is lighter than glass','Gold repels meteoroids'],a:0,w:'Gold reflects over 95% of infrared light. JWST has 18 segments; here you phase six clusters.',act:{k:'tap',s:['Cluster A','Cluster B','Cluster C','Cluster D','Cluster E','Cluster F']}},
{r:'sci',t:'Read the TESS light curve',q:'TESS sees starlight dip on day 10.0 and day 47.4. If the pattern repeats, when is the next dip?',o:['Day 84.8','Day 57.4','Day 94.8'],a:0,w:'Period = 47.4 − 10.0 = 37.4 days, so 47.4 + 37.4 = 84.8.',act:{k:'tap',s:['Tag dip: day 10.0','Tag dip: day 47.4','Tag dip: day 84.8']}}]},
{n:'First Contact',d:'Fictional scenario built on real radio astronomy and astrobiology.',steps:[
{r:'bay',t:'Decode the Golden Record',g:2,q:'Voyager’s Golden Record cover uses a hydrogen atom diagram as a ruler. Hydrogen’s spin-flip line has which wavelength?',o:['21 cm','1 m','3 mm'],a:0,w:'The 21 cm line (1420 MHz) is a natural universal reference.',act:{k:'tap',s:['Pulsar map','Hydrogen unit','Playback diagram','Uranium clock']}},
{r:'lab',t:'Check the biosignatures',g:2,q:'What has NASA actually found so far?',o:['Evidence of a Europa ocean and organic building blocks on Bennu, but no confirmed life','Confirmed alien cities','Living microbes in Bennu samples'],a:0,w:'Europa’s ocean is strongly suggested by evidence. Bennu samples held amino acids. Life beyond Earth is unconfirmed.'},
{r:'nav',t:'Deep-space meteoroids',k:'met'},
{r:'nav',t:'Tune to the hydrogen line',g:2,q:'Frequency = speed of light ÷ wavelength = 300,000 km/s ÷ 0.21 m. About how many MHz?',o:['~1,430 MHz','~143 MHz','~14,300 MHz'],a:0,w:'3×10⁸ ÷ 0.21 ≈ 1.43×10⁹ Hz, near the real 1420.4 MHz.',act:{k:'tune',t:1420,tol:12,mn:1100,mx:1700}}]}];
const TAG=['Real engineering principle','Simplified educational simulation','Fictional scenario, real science facts'];
const cur=()=>G.mode=='lobby'||G.mode=='fin'?null:M[G.mi].steps[G.si];
const $h=(i,h)=>$(i).innerHTML=h;
/* ---------- lobby ---------- */
function lobby(){G.mode='lobby';['hud','alert','pad','fb','mod'].forEach(i=>$(i).classList.add('hide'));$('lobby').classList.remove('hide');
$h('lobby',`<div class="panel" style="width:min(420px,100%)"><h2>ASTRO-QUEST: ODYSSEY</h2><small>Build your astronaut, then pick a mission.</small>
<p class="row"><b>Callsign</b> <input type="text" maxlength="10" value="${S.name}" oninput="S.name=this.value.toUpperCase()||'ARYA';sv()" style="width:130px"></p>
<div class="row"><b>Suit</b>${COL.map((q,i)=>`<button class="sw ${S.col==i?'on':''}" style="background:${q[0]}" onclick="S.col=${i};sv();lobby()"></button>`).join('')}</div>
<div class="row"><b>Patch</b>${PAT.map((q,i)=>`<button class="${S.pat==i?'on':''}" onclick="S.pat=${i};sv();lobby()">${q}</button>`).join('')}</div>
<div class="row"><b>Ribbon</b>${RIB.map((q,i)=>`<button class="sw ${S.rib==i?'on':''}" style="background:${q};border-radius:6px" onclick="S.rib=${i};sv();lobby()"></button>`).join('')}</div><hr style="border-color:#38bdf833">
${M.map((m,i)=>`<button class="bt" onclick="start(${i})"><b>Mission ${i+1}: ${m.n}</b> ${S.ea[i]?'🏅 patch earned':''}<br><small>${m.d}</small></button>`).join('')}
<small>Move: WASD/arrows · Console: E · Inside/outside view: V</small></div>`)}
/* ---------- mission flow ---------- */
function start(i){b(660);G.mi=i;G.si=0;G.hits=0;G.ov=1;G.px=480;G.py=270;G.mode='in';G.met=[];G.flag=G.dance=G.orb=0;G.rv=300;
$('lobby').classList.add('hide');['hud','pad'].forEach(q=>$(q).classList.remove('hide'));$('fb').classList.add('hide');hudu();step()}
function step(){const s=cur();if(!s){return fin()}if(s.k=='met'){G.ms={sp:0,rs:0,tm:22,cd:70};b(440,.4,'sawtooth')}hudu()}
function hudu(){const s=cur();$('hh').textContent=(100-G.hits*34)+'%';$('sh').textContent='🛡'.repeat(3-G.hits)+'💥'.repeat(G.hits);
$('ob').textContent=`ARIA OVERRIDE (${G.ov})`;$('ob').disabled=!G.ov||!s;$('vb').textContent=G.mode=='out'?'INSIDE SHIP [V]':'OUTSIDE VIEW [V]';
if(s)$h('obj',`<b>OBSTACLE ${G.si+1}/${M[G.mi].steps.length}: ${s.t}</b><br><small>${s.k=='met'?'ARIA: Press V for outside view and dodge 3 meteoroids!':'ARIA: Go to the glowing '+R[s.r][4]+' console and press E.'}</small>`)}
function sc(){b(880,.3,'triangle');G.si++;closeM();step()}
function ovr(){if(!G.ov||!cur())return;G.ov--;sc()}
function vw(){if(G.mode!='in'&&G.mode!='out')return;b(500,.08);G.mode=G.mode=='in'?'out':'in';hudu()}
function hit(why){b(120,.3,'sawtooth');G.hits++;hudu();if(G.hits>=3){G.mode='fail';$('alert').classList.add('hide');$('mc').innerHTML=`<h2 class="bad">Mission failed: hull breached</h2><p>Three meteoroid impacts exceeded the hull’s shielding. ${why} When the alert flashes, switch to the outside view [V] and steer out of the red warning line.</p><button class="go" onclick="start(G.mi)">Restart mission</button><button onclick="lobby()">Back to lobby</button>`;$('mod').classList.remove('hide')}}
/* ---------- puzzles ---------- */
let P;function act(){if(G.mode=='fin'||G.mode!='in')return;const s=cur();let n=null;for(const k in C)if(Math.hypot(G.px-C[k][0],G.py-C[k][1])<75)n=k;
if(!n)return tst('Walk to a console (glowing circle) and press E');if(s.k=='met')return tst('Press V: switch to OUTSIDE view and dodge!');if(n!=s.r)return tst('That console isn’t needed now. Look for the yellow ring.');
P={s,ok:0,n:0,t:{},b:s.act&&s.act.k=='load'?s.act.b.map(()=>1):0,w:0};pz();$('mod').classList.remove('hide')}
function pz(){const s=P.s,a=s.act;let h=`<h3>${s.t}</h3><small>${TAG[s.g||0]}</small>`;
if(!P.ok){h+=`<p>🧠 ${s.q}</p>`+s.o.map((o,i)=>`<button class="bt" onclick="ans(${i})">${o}</button>`).join('')}
else{h+=`<p class="ok">✔ ${s.w}</p>`;if(!a)h+=`<button class="go" onclick="sc()">Continue ▶</button>`;
else if(a.k=='load'){const tot=a.b.reduce((q,z,i)=>q+(P.b[i]?z[1]:0),0),cr=a.b.every((z,i)=>!z[2]||P.b[i]),okk=tot<=a.lim&&cr;h+=`<p>Bus load: <b class="${okk?'ok':'bad'}">${tot} W</b> / ${a.lim} W ${cr?'':'<span class="bad">critical system is OFF!</span>'}</p><div class="row">${a.b.map((z,i)=>`<button onclick="P.b[${i}]=!P.b[${i}];pz()" style="border-color:${z[2]?'#fb7185':'#38bdf8'}">${P.b[i]?'ON ':'OFF'} · ${z[0]} ${z[1]}W${z[2]?' ★':''}</button>`).join('')}</div><button class="go" ${okk?'':'disabled'} onclick="sc()">Lock bus ▶</button>`}
else if(a.k=='seq'){const left=a.s.map((z,i)=>[z,i]).filter(z=>z[1]>=P.n).reverse();h+=`<p>Do the steps in the right order:</p>`+a.s.slice(0,P.n).map(z=>`<div class="ok">✔ ${z}</div>`).join('')+left.map(z=>`<button class="bt" onclick="sq(${z[1]})">${z[0]}</button>`).join('');if(P.n>=a.s.length)h+=`<button class="go" onclick="sc()">Done ▶</button>`}
else if(a.k=='tap'){h+=`<p>Complete every action:</p><div class="row">${a.s.map((z,i)=>`<button class="${P.t[i]?'on':''}" onclick="P.t[${i}]=1;b(700,.08);pz()">${P.t[i]?'✔ ':''}${z}</button>`).join('')}</div><button class="go" ${a.s.every((z,i)=>P.t[i])?'':'disabled'} onclick="sc()">All done ▶</button>`}
else if(a.k=='tune'){h+=`<p>Receiver: <b id="tv">${a.mn} MHz</b></p><input type="range" min="${a.mn}" max="${a.mx}" step="2" value="${a.mn}" style="width:100%" oninput="tu(this.value)"><br><button id="tb" class="go" disabled onclick="sc()">Lock signal ▶</button>`}}
h+=`<div id="fb2"></div><button onclick="closeM()">Close</button>`;$('mc').innerHTML=h}
function ans(i){const s=P.s;if(i==s.a){b(900,.2,'triangle');P.ok=1;pz()}else{b(150,.2,'sawtooth');P.w++;$('fb2').innerHTML=`<p class="bad">Not quite, think again. ${P.w>1?'Hint: '+s.w:''}</p>`}}
function sq(i){if(i==P.n){b(700,.08);P.n++;pz()}else{b(150,.2,'sawtooth');$('fb2').innerHTML='<p class="bad">Wrong order. What must happen BEFORE that step?</p>'}}
function tu(v){v=+v;const a=P.s.act,l=Math.abs(v-a.t)<=a.tol;$('tv').textContent=v+' MHz'+(l?' ✔ LOCKED':'');$('tb').disabled=!l}
function closeM(){if(G.mode!='fail')$('mod').classList.add('hide')}
let tt;function tst(m){$('alert').className='';$('alert').style.background='#0f3a66';$('alert').textContent=m;clearTimeout(tt);tt=setTimeout(()=>{$('alert').classList.add('hide');$('alert').style.background=''},2200)}
/* ---------- finale ---------- */
const FACT=['Chandrayaan-3 (ISRO) made the first soft landing near the lunar south pole on 23 Aug 2023.','Permanently shadowed polar craters stay colder than −170 °C and can hold water ice.','Moon gravity is about one sixth of Earth’s, so every step bounces.','NASA’s Artemis programme aims to return astronauts to the lunar south polar region.'];
const BOT=[[/hello|hi\b|hey/,'Greetings, Earth traveller! I am a fictional alien, but my facts are real. Ask about hydrogen, Voyager, Europa, Bennu, Mars, Webb or black holes.'],[/hydrogen|1420|21 ?cm/,'Neutral hydrogen flips its electron spin and emits radio waves at 1420.4 MHz (21 cm). Astronomers use it to map the Milky Way’s spiral arms.'],[/voyager|record/,'Voyager 1 and 2 launched in 1977 with golden records. Voyager 1 entered interstellar space in 2012.'],[/europa/,'Jupiter’s moon Europa likely hides a salty ocean under its ice. NASA’s Europa Clipper, launched in 2024, will study it.'],[/bennu|osiris/,'OSIRIS-REx returned 121.6 g of asteroid Bennu in 2023. It held carbon-rich material and amino acids.'],[/mars/,'Mars rovers like Perseverance cache rock samples for a future return to Earth.'],[/webb|jwst/,'The James Webb Space Telescope watches in infrared from the Sun–Earth L2 point, about 1.5 million km from Earth.'],[/black ?hole/,'The Event Horizon Telescope imaged the black hole M87* in 2019. Nothing escapes inside the event horizon.'],[/life|alien|seti|signal/,'Honest answer: humanity has not confirmed life beyond Earth, and SETI has no confirmed signal. That is why we keep listening!'],[/moon|artemis/,'Artemis aims to return astronauts to the Moon’s south pole, where shadowed craters may hold water ice.']];
function fin(){G.mode='fin';$('alert').classList.add('hide');$('pad').classList.add('hide');const i=G.mi;let h='';
if(i==0)h=`<b>🌕 Touchdown at the lunar south pole!</b><p id="fi" class="m">${FACT[0]}</p><button onclick="fa('f')">🇮🇳 Plant flag</button><button onclick="fa('r')">🛞 Drive rover</button><button onclick="fa('d')">🕺 Celebrate</button>`;
else if(i==1)h=`<b>🪐 Orbiting TOI-700 d</b><p id="fi" class="m">Artist’s concept. TESS found this Earth-size planet about 101 light-years away in its star’s habitable zone. Its surface and atmosphere are still unknown.</p><button onclick="fa('o')">🔄 Orbit the planet</button><button onclick="fa('s')">🧪 Take sample (simulated)</button>`;
else h=`<b>👽 First contact (fictional scenario, real facts)</b><div id="log" class="panel"></div><div class="row"><input id="ci" type="text" placeholder="Ask the alien…" style="flex:1" onkeydown="event.stopPropagation();if(event.key=='Enter')ch()"><button onclick="ch()">Send</button></div><div class="row">${['hydrogen','Voyager','Europa','Bennu','Webb','life?'].map(q=>`<button onclick="$('ci').value='${q}';ch()">${q}</button>`).join('')}</div>`;
$h('fb',h+`<div><button class="go" onclick="endm()">END MISSION ▶ Home</button></div>`);$('fb').classList.remove('hide');if(i==2)say('👽','Greetings, traveller! You found the 1420 MHz hydrogen line. Ask me anything about space.')}
function fa(k){b(700);const f=$('fi');if(k=='f'){G.flag=1;f.textContent='Flag planted! '+FACT[1]}if(k=='r'){G.rv=(G.rv+70)%260+280;f.textContent='Rover driving. '+FACT[2]}if(k=='d'){G.dance=!G.dance;f.textContent=FACT[3]}if(k=='o'){G.orb=!G.orb;f.textContent=G.orb?'Orbit started: you circle a planet that receives about 86% of the sunlight Earth gets.':'Orbit paused.'}
if(k=='s'){$('mc').innerHTML=`<h3>Simulated sample readout</h3><small>Measured by TESS: radius ≈ 1.1 Earth radii, orbit 37.4 days, about 86% of Earth’s sunlight.</small><p>Unknown: atmosphere, water, surface. A real answer needs telescopes like JWST.</p><button onclick="closeM()">Close</button>`;$('mod').classList.remove('hide')}}
function say(w,t){const l=$('log');l.innerHTML+=`<p><b>${w}</b> ${t}</p>`;l.scrollTop=1e5}
function ch(){const i=$('ci'),q=i.value.trim();if(!q)return;i.value='';say('You:',q);const r=BOT.find(z=>z[0].test(q.toLowerCase()));setTimeout(()=>{b(500,.1,'sine');say('👽',r?r[1]:'Interesting! Try hydrogen, Voyager, Europa, Bennu, Mars, Webb or black holes.')},350)}
